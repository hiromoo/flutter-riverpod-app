name: Reading Shelf

on:
  pull_request:
    paths:
      - 'examples/reading_shelf/**'
      - '.github/workflows/reading-shelf.yml'
      - 'SKILL.md'
      - 'references/**'
  push:
    paths:
      - 'examples/reading_shelf/**'
      - '.github/workflows/reading-shelf.yml'
      - 'SKILL.md'
      - 'references/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
        with:
          path: examples/reading_shelf/.fvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
          cache: true
      - name: Validate and regenerate API client
        working-directory: examples/reading_shelf
        run: bash scripts/validate_generated.sh
      - name: Verify generated code is committed
        run: >-
          git diff --exit-code --
          examples/reading_shelf/api/openapi.yaml
          examples/reading_shelf/packages/api_client
          examples/reading_shelf/lib
          examples/reading_shelf/pubspec.lock
      - name: Test API server
        working-directory: examples/reading_shelf/server
        run: dart test && dart analyze
      - name: Test Flutter app
        working-directory: examples/reading_shelf
        run: flutter test
      # Exercises the delivery config path from references/ci-and-delivery.md
      # with placeholder values; the sample has no store or Hosting targets.
      - name: Write staging CI config
        working-directory: examples/reading_shelf
        env:
          APP_ENV: staging
          API_BASE_URL: https://api.staging.example.com
          SUPABASE_URL: https://staging.supabase.example.com
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: sh scripts/ci/write_config.sh
      - name: Build staging Web and Android release
        working-directory: examples/reading_shelf
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          flutter build web --release --dart-define-from-file=config/ci.json
          flutter build appbundle --release --flavor staging \
            --dart-define-from-file=config/ci.json \
            --build-number=$((RUN_NUMBER * 10 + RUN_ATTEMPT))
