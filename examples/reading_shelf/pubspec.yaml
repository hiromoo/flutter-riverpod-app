name: reading_shelf
description: Reading Shelf sample app demonstrating the flutter-riverpod-app skill.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.7
  riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  dio: ^5.7.0
  supabase_flutter: ^2.18.3
  firebase_core: ^4.15.2
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  reading_shelf_api_client:
    path: packages/api_client
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.0-dev.3
  go_router_builder: ^4.5.0
  flutter_flavorizr: 2.6.0
flutter:
  generate: true
  uses-material-design: true
